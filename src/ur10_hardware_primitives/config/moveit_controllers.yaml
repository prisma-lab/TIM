moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager
moveit_manage_controllers: false
moveit_simple_controller_manager:
  controller_names: [scaled_joint_trajectory_controller]
  scaled_joint_trajectory_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints: [shoulder_pan_joint, shoulder_lift_joint, elbow_joint, wrist_1_joint, wrist_2_joint, wrist_3_joint]
# Speed scaling/pendant pauses can extend wall-clock execution time. The primitive
# manager enforces its separate wall-clock timeout and requests cancellation.
trajectory_execution:
  execution_duration_monitoring: false
  allowed_start_tolerance: 0.01
