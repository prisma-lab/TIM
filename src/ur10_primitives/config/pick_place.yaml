# Simulation only: Gazebo UR10 with Robotiq 2F-85.
ur10_primitive_manager:
  ros__parameters:
    use_sim_time: true
    command_topic: /ur10/primitives/command
    status_topic: /ur10/primitives/status
    seed_state_topic: /seed_ur10/state
    failure_fact: manipulation.failed
    primitives: [move_a_b, pick, place]
    move_a_b:
      plugin: ur10_primitives/MoveABPrimitive
      targets: [pick, place]
      target_topics:
        pick: /ur10/targets/pick
        place: /ur10/targets/place
    pick:
      plugin: ur10_primitives/PickPrimitive
      target_topic: /ur10/targets/pick
    place:
      plugin: ur10_primitives/PlacePrimitive
      target_topic: /ur10/targets/place
    manipulation:
      frame: world
      group: ur_manipulator
      tool_link: tool0
      tcp_offset: 0.15
      approach_height: 0.1
      target_timeout: 2.0
      execution_timeout: 90.0
      velocity_scale: 0.25
      open:
        target_position: 0.0
        state_fact: internal.open
      grasp:
        target_position: 0.25
        state_fact: internal.grasp
    gripper:
      motion_duration: 1.0
      feedback_timeout: 2.0
      execution_timeout: 15.0
