ur10_primitive_manager:
  ros__parameters:
    use_sim_time: true
    command_topic: /ur10/gripper/command
    status_topic: /ur10/gripper/status
    seed_state_topic: /seed_ur10/state
    failure_fact: gripper.failed
    primitives: [open_gripper, close_gripper]
    open_gripper:
      plugin: ur10_primitives/GripperPrimitive
      target_position: 0.0
      state_fact: gripper.open
    close_gripper:
      plugin: ur10_primitives/GripperPrimitive
      target_position: 0.75
      state_fact: gripper.closed
    gripper:
      action_name: /robotiq_gripper_controller/follow_joint_trajectory
      joint_states_topic: /joint_states
      joint_name: robotiq_85_left_knuckle_joint
      position_tolerance: 0.02
      motion_duration: 2.0
      server_timeout: 10.0
      execution_timeout: 20.0
      feedback_timeout: 2.0
