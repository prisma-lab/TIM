# Service adapters only. The external provider owns robot/gripper execution.
ur10_service_manager:
  ros__parameters:
    use_sim_time: false
    command_topic: /ur10/hardware/primitives/command
    status_topic: /ur10/hardware/primitives/status
    seed_state_topic: /seed_ur10_services/state
    failure_fact: manipulation.failed
    primitives: [move, pick, place]
    services:
      start_topic: /motion_start
      end_topic: /motion_end
      response_timeout: 5.0
      execution_timeout: 180.0
    move:
      plugin: ur10_hardware_primitives/MoveServicePrimitive
      service: /motion_planner/reach_position
      max_velocity: 0.05  # m/s, forwarded as max_vel
      pose_timeout: 2.0
      # One complete named pose set; each pose keeps its own header.frame_id.
      target_topic: /target_poses
    pick:
      plugin: ur10_hardware_primitives/PickServicePrimitive
      service: /motion_planner/pick  # inverse_msgs/srv/EnqueueTrigger
    place:
      plugin: ur10_hardware_primitives/PlaceServicePrimitive
      service: /motion_planner/place  # inverse_msgs/srv/EnqueueTrigger
